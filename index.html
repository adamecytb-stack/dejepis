<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>1. svetová vojna – dejepis</title>
<meta name="description" content="Učebná appka z dejepisu: 1. svetová vojna. Výklad po témach, skúška po každej téme a veľký test na známku.">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="1. sv. vojna">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --accent:#2563eb;
    --soft:#e8f0ff;
    --ink:#1b2333;
    --muted:#5d6b85;
    --ok:#15803d;
    --bad:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink);
    background:#f3f1fb;
    min-height:100vh;
    line-height:1.5;
  }
  /* prechod na pozadi je na pevnej vrstve, lebo background-attachment:fixed na iPhone nefunguje */
  body::before{
    content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;
    background:linear-gradient(160deg,#eef4ff 0%,#f6efff 45%,#fff3e8 100%);
  }
  .wrap{
    max-width:720px;margin:0 auto;
    padding:16px 14px 56px;
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
  }
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  /* na uzkom mobile by sa stitok do listy nezmestil; nazov obrazovky je aj v karte pod nou */
  .topbar .pill{display:none;white-space:nowrap;}
  .logo{
    font-size:22px;font-weight:800;letter-spacing:-0.5px;cursor:pointer;
    background:linear-gradient(90deg,#15803d,#2563eb 45%,#c2410c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .spacer{flex:1;}
  .card{
    background:#fff;border-radius:18px;padding:18px;
    box-shadow:0 10px 26px rgba(29,45,86,.10);
    margin-bottom:14px;
  }
  .card.center{text-align:center;}
  h1{font-size:25px;line-height:1.2;margin:0 0 6px;}
  h2{font-size:20px;line-height:1.3;margin:0 0 10px;}
  h3{font-size:17px;margin:0 0 8px;}
  h4{font-size:15px;margin:0 0 6px;}
  p{margin:0 0 10px;}
  .muted{color:var(--muted);}
  .small{font-size:14px;}
  .kicker{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:4px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    padding:13px 20px;border:none;border-radius:14px;cursor:pointer;
    font-size:16px;font-weight:700;font-family:inherit;line-height:1.25;
    background:var(--accent);color:#fff;
    box-shadow:0 4px 12px rgba(29,45,86,.18);
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:none;padding:11px 18px;}
  .btn.grey{background:#eef1f7;color:#41506b;box-shadow:none;}
  .btn.big{font-size:18px;padding:16px 22px;border-radius:16px;}
  .btn.small{font-size:14px;padding:8px 14px;border-radius:10px;}
  .btn.wide{width:100%;}
  .btn:disabled{opacity:.45;cursor:default;transform:none;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .pill{
    display:inline-block;padding:5px 12px;border-radius:999px;
    background:var(--soft);color:var(--accent);font-weight:700;font-size:14px;
  }
  .sound{
    border:2px solid #dfe5f1;background:#fff;border-radius:12px;width:44px;height:40px;
    font-size:18px;cursor:pointer;
  }
  .bar{height:12px;border-radius:999px;background:#e5eaf4;overflow:hidden;margin:10px 0 6px;}
  .bar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease;}

  /* ---- cesta temami ---- */
  .path{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .step{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    font-family:inherit;font-size:16px;color:inherit;cursor:pointer;
    background:#fff;border-radius:18px;padding:13px 14px;
    box-shadow:0 6px 18px rgba(29,45,86,.08);
    border:2px solid transparent;
  }
  .step .num{
    flex:0 0 44px;height:44px;border-radius:14px;background:var(--soft);color:var(--accent);
    font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;
  }
  .step.done .num{background:#e3f6ea;color:var(--ok);}
  .step.next{border-color:var(--accent);}
  .step .tt{font-weight:700;line-height:1.3;}
  .step .ss{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:2px;}
  .step .chev{margin-left:auto;color:#a8b3c9;font-size:24px;flex:0 0 auto;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px;}
  .tab{
    border:2px solid #dfe5f1;background:#fff;border-radius:999px;padding:8px 16px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#41506b;
  }
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer;}

  /* ---- vyklad ---- */
  .pts{margin:0;padding-left:20px;}
  .pts li{margin-bottom:8px;}
  .pts li:last-child{margin-bottom:0;}
  .pts b, .term b, .dates b{color:var(--accent);}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .two .side{background:var(--soft);border-radius:14px;padding:12px;}
  .two .side.b{background:#fff3e8;}
  .two .side h4{color:var(--accent);}
  .two .side.b h4{color:#c2410c;}
  /* zoznamy blokov maju rovnake farby ako mapa: Centralne mocnosti oranzova, Dohoda modra */
  .two.blocs .side{background:#fff1e6;}
  .two.blocs .side h4{color:#c2410c;}
  .two.blocs .side.b{background:#e8f0ff;}
  .two.blocs .side.b h4{color:#2563eb;}
  .two ul{margin:0;padding-left:18px;}
  .two li{margin-bottom:4px;}
  .term{
    border-left:6px solid var(--accent);background:var(--soft);
    border-radius:0 14px 14px 0;padding:12px 14px;
  }
  .term h3{color:var(--accent);margin-bottom:2px;}
  .term p{margin:0;}
  .note{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15.5px;}
  .note.tip{background:#fffbea;border:2px solid #f5d67a;}
  .note.extra{background:#fff;border:2px dashed #a8b3c9;}
  .note .nh{font-weight:800;display:block;margin-bottom:2px;}
  .dates{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline;}
  .dates .d{font-weight:800;color:var(--accent);white-space:nowrap;}
  .must{border:2px solid var(--accent);}
  .dock{
    position:-webkit-sticky;position:sticky;bottom:0;z-index:5;display:flex;gap:10px;
    margin:0 -14px;padding:10px 14px;
    padding-bottom:max(10px, env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);border-top:1px solid #e3e8f2;
  }
  .dock .btn{flex:1;}
  .dock .btn.grey{flex:0 0 auto;}

  /* ---- schematicka mapa ---- */
  .map{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:46px;gap:6px;margin:6px 0 10px;}
  .tile{
    border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-weight:800;font-size:12.5px;line-height:1.15;padding:2px 3px;color:#fff;
  }
  .tile.d{background:#2563eb;}
  .tile.c{background:#c2410c;}
  .tile.n{background:#e5eaf4;color:#41506b;}
  .tile.new{background:#15803d;}
  .tile.old{background:#e5eaf4;color:#41506b;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;}

  /* ---- otazky ---- */
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .opt{
    text-align:left;font-family:inherit;font-size:16px;cursor:pointer;color:inherit;
    background:#f5f7fb;border:2px solid #e3e8f2;border-radius:14px;
    padding:12px 14px;display:flex;gap:10px;align-items:flex-start;width:100%;
  }
  .opt .lettr{
    flex:0 0 28px;height:28px;border-radius:8px;background:#fff;
    border:2px solid #d7deec;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;
  }
  .opt .tag{margin-left:auto;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;padding-top:5px;}
  /* oznacenie pred kontrolou je tmave, nie vo farbe temy, aby sa neplietlo so zelenou "spravne" */
  .opt.on{border-color:var(--ink);background:#eef1f7;}
  .opt.on .lettr{background:var(--ink);border-color:var(--ink);color:#fff;}
  .opt.correct{background:#e7f8ee;border-color:var(--ok);}
  .opt.correct .lettr{background:#fff;border-color:var(--ok);color:var(--ok);}
  .opt.wrong{background:#fdecec;border-color:var(--bad);}
  .opt.wrong .lettr{background:#fff;border-color:var(--bad);color:var(--bad);}
  .opt.missed{background:#fff;border:2px dashed var(--ok);}
  .opt.missed .tag{color:var(--ok);}
  .opt.wrong .tag{color:var(--bad);}
  .opt:disabled{cursor:default;color:inherit;opacity:1;}
  .grp{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .grow{background:#f5f7fb;border:2px solid #e3e8f2;border-radius:14px;padding:10px 12px;}
  .grow.okrow{background:#e7f8ee;border-color:var(--ok);}
  .grow.badrow{background:#fdecec;border-color:var(--bad);}
  .gname{font-weight:700;margin-bottom:8px;}
  .gbtns{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .gb{
    font-family:inherit;font-size:14.5px;font-weight:700;cursor:pointer;line-height:1.2;
    border:2px solid #d7deec;background:#fff;color:#41506b;border-radius:10px;padding:9px 6px;
  }
  .gb.on{background:var(--ink);border-color:var(--ink);color:#fff;}
  .gb.right{background:var(--ok);border-color:var(--ok);color:#fff;}
  .gb.wrongsel{background:#fff;border-color:var(--bad);color:var(--bad);text-decoration:line-through;}
  .gb:disabled{cursor:default;opacity:1;}
  .txtwrap{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap;}
  .txtin{
    flex:1 1 200px;min-width:0;font-family:inherit;font-size:18px;font-weight:600;
    padding:12px 14px;border-radius:14px;border:2px solid #d7deec;background:#f5f7fb;color:var(--ink);
    outline:none;
  }
  .txtin:focus{border-color:var(--accent);background:#fff;}
  .txtin.okin{border-color:var(--ok);background:#e7f8ee;}
  .txtin.badin{border-color:var(--bad);background:#fdecec;}
  .txtin:disabled{opacity:1;-webkit-text-fill-color:var(--ink);}
  .hint{font-size:14px;color:var(--muted);margin-top:8px;}
  .fb{border-radius:14px;padding:14px 16px;margin-top:14px;}
  .fb.ok{background:#e7f8ee;border:2px solid var(--ok);}
  .fb.no{background:#fdecec;border:2px solid var(--bad);}
  .fb .head{font-weight:800;margin-bottom:4px;}
  .fb.ok .head{color:var(--ok);}
  .fb.no .head{color:var(--bad);}

  /* ---- vysledky ---- */
  .bigico{font-size:52px;line-height:1;margin-bottom:6px;}
  .grade{
    font-size:72px;font-weight:900;line-height:1;text-align:center;
    background:linear-gradient(90deg,#15803d,#2563eb);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .stat{background:var(--soft);border-radius:14px;padding:10px 14px;text-align:center;min-width:92px;font-size:14px;}
  .stat b{display:block;font-size:22px;}
  .miss{border-left:5px solid var(--bad);background:#fff6f6;border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px;}
  .miss .lbl{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #edf0f6;}
  .trow:first-of-type{border-top:none;}
  .trow .tn{flex:1;min-width:0;line-height:1.3;}
  .trow .ts{font-weight:800;white-space:nowrap;}
  .trow .ts.full{color:var(--ok);}
  .trow .ts.part{color:var(--bad);}
  .cheat{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline;}
  .cheat .k{font-weight:800;color:var(--accent);}
  .cheat.wide .k{white-space:nowrap;}

  @media (hover:hover){
    .btn:hover:enabled{filter:brightness(1.07);}
    .opt:hover:enabled{border-color:var(--accent);}
    .step:hover{border-color:var(--accent);}
    .gb:hover:enabled{border-color:var(--accent);}
  }
  button:focus-visible, .logo:focus-visible{outline:3px solid #1b2333;outline-offset:2px;}
  @media (min-width:560px){
    .wrap{padding-top:22px;}
    .card{padding:22px;}
    .map{grid-auto-rows:54px;}
    .tile{font-size:14px;}
    .logo{font-size:26px;}
    .topbar .pill{display:inline-block;}
  }
  @media (max-width:380px){
    .cheat.wide{grid-template-columns:1fr;gap:0;}
    .cheat.wide .k{margin-top:8px;}
    .tile{font-size:11.5px;}
  }
  @media (prefers-reduced-motion:reduce){
    .btn, .bar span{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ============================================================
   UCEBNA APLIKACIA - DEJEPIS: 1. SVETOVA VOJNA
   Obsah je zo skolskych poznamok. Bloky typu "extra" su
   dovysvetlenie navyse, v zosite nie su.
   ============================================================ */

/* ===== FARBY TEM ===== */
var PAL = [
  {c:"#2563eb", s:"#e8f0ff"},
  {c:"#15803d", s:"#e6f6ec"},
  {c:"#c2410c", s:"#fff1e6"},
  {c:"#7c3aed", s:"#f2ecff"},
  {c:"#0e7490", s:"#e3f5f9"},
  {c:"#be123c", s:"#ffe9ee"}
];
/* skuska z temy je zvladnuta od 80 % */
var PASS = 0.8;

/* ===== DATA: TEMY (vyklad + otazky) =====
   Typy otazok:
   mc    - vyber jednej moznosti, PRVA v poli "o" je spravna (pri zobrazeni sa zamiesaju)
   tf    - pravda / nepravda
   txt   - pisana odpoved, "acc" su uznane tvary
   date  - pisany datum, "n" su ocakavane cisla [den, mesiac, rok] alebo [mesiac, rok] alebo [rok]
   multi - oznac vsetky spravne ("ok" spravne, "no" nespravne)
   group - roztried polozky do dvoch skupin ("a" patri do g[0], "b" do g[1])
   order - zorad, pole "o" je v spravnom poradi */
var LESSONS = [
{
  id:"sarajevo",
  title:"Dva bloky a výstrely v Sarajeve",
  short:"Trojspolok, Dohoda a atentát 28. 6. 1914",
  intro:"Pred vojnou sa európske veľmoci rozdelili na dva tábory, ktoré si neverili. Stačila jedna iskra a tou bol atentát v Sarajeve.",
  blocks:[
    {t:"list", h:"Dva bloky proti sebe", li:[
      "Vytvorením <b>Trojspolku</b> a <b>Dohody</b> sa veľmoci rozdelili na <b>dva bloky stojace proti sebe</b>.",
      "Medzi jednotlivými blokmi panovala <b>nedôvera</b>."
    ]},
    {t:"two", k:"blocs",
      a:{h:"Štáty Trojspolku", li:["Rakúsko-Uhorsko","Nemecko","Taliansko"]},
      b:{h:"Štáty Dohody", li:["Rusko","Francúzsko","Veľká Británia"]}},
    {t:"list", h:"Atentát v Sarajeve", li:[
      "<b>28. 6. 1914</b> <b>Gavrilo Princip</b> zavraždil v <b>Sarajeve</b> <b>Františka Ferdinanda d'Este</b> z Rakúsko-Uhorska aj s manželkou."
    ]},
    {t:"extra", x:"V zošite je napísané „panovníka Rakúsko-Uhorska Ferdinanda d'Este“. Presne to bol <b>následník trónu</b>, teda ten, kto mal byť ďalším panovníkom. Panovníkom bol vtedy František Jozef I. (príde v ďalšej téme)."},
    {t:"tip", x:"<b>Troj</b>spolok = tri štáty: Rakúsko-Uhorsko, Nemecko, Taliansko. Dohoda = tí, čo ich obkolesujú: Francúzsko a Veľká Británia zo západu, Rusko z východu. Skratka <b>R-U</b> znamená Rakúsko-Uhorsko."}
  ],
  must:[
    "Trojspolok: Rakúsko-Uhorsko, Nemecko, Taliansko",
    "Dohoda: Rusko, Francúzsko, Veľká Británia",
    "28. 6. 1914 – Sarajevo – Gavrilo Princip – František Ferdinand d'Este"
  ],
  qs:[
    {t:"group", q:"Zaraď štáty do blokov tak, ako boli rozdelené pred vojnou.", g:["Trojspolok","Dohoda"],
     a:["Rakúsko-Uhorsko","Nemecko","Taliansko"], b:["Rusko","Francúzsko","Veľká Británia"],
     e:"Trojspolok: Rakúsko-Uhorsko, Nemecko, Taliansko. Dohoda: Rusko, Francúzsko, Veľká Británia."},
    {t:"date", q:"Kedy bol spáchaný atentát v Sarajeve? Napíš celý dátum.", n:[28,6,1914], sol:"28. 6. 1914",
     e:"Atentát v Sarajeve bol 28. 6. 1914. Presne o mesiac neskôr sa začala vojna."},
    {t:"txt", q:"Kto spáchal atentát v Sarajeve?", acc:["Gavrilo Princip","Princip","Gavrilo Princíp"], sol:"Gavrilo Princip",
     e:"Atentát spáchal Gavrilo Princip."},
    {t:"mc", q:"Koho zavraždil Gavrilo Princip v Sarajeve?",
     o:["Františka Ferdinanda d'Este s manželkou","Františka Jozefa I.","nemeckého cisára Wilhelma II.","ruského cára Mikuláša II."],
     e:"Obeťou atentátu bol František Ferdinand d'Este z Rakúsko-Uhorska a jeho manželka."},
    {t:"mc", q:"V ktorom meste sa stal atentát, ktorý bol iskrou vojny?", o:["v Sarajeve","v Belehrade","vo Viedni","v Paríži"],
     e:"Atentát sa stal v Sarajeve, preto „osudné výstrely zo Sarajeva“."},
    {t:"tf", q:"Pred vojnou si oba bloky veľmocí navzájom dôverovali.", a:false,
     e:"Naopak, medzi jednotlivými blokmi panovala nedôvera."},
    {t:"multi", q:"Ktoré štáty tvorili Trojspolok?", ok:["Rakúsko-Uhorsko","Nemecko","Taliansko"], no:["Rusko","Francúzsko","Veľká Británia"],
     e:"Trojspolok tvorili Rakúsko-Uhorsko, Nemecko a Taliansko. Ostatné tri štáty patrili do Dohody."},
    {t:"txt", q:"Ako sa volal blok, do ktorého patrili Rusko, Francúzsko a Veľká Británia?", acc:["Dohoda","Trojdohoda","štáty Dohody"], sol:"Dohoda",
     e:"Rusko, Francúzsko a Veľká Británia tvorili Dohodu."},
    {t:"txt", q:"Ako sa volal blok, ktorý tvorili Rakúsko-Uhorsko, Nemecko a Taliansko?", acc:["Trojspolok","štáty Trojspolku"], sol:"Trojspolok",
     e:"Rakúsko-Uhorsko, Nemecko a Taliansko tvorili Trojspolok."}
  ]
},
{
  id:"rozputanie",
  title:"Rozpútanie vojny",
  short:"Ultimátum Srbsku a 28. 7. 1914",
  intro:"Atentát sa stal zámienkou. Do mesiaca z neho vyrástla vojna, do ktorej sa zapojili oba bloky.",
  blocks:[
    {t:"list", h:"Od atentátu k vojne", li:[
      "Nemecký cisár <b>Wilhelm II.</b> využil atentát na rozpútanie vojny.",
      "Podnecoval svojho spojenca, panovníka Rakúsko-Uhorska <b>Františka Jozefa I.</b>, aby dal Srbsku <b>ultimátum</b>.",
      "Srbsko sa malo <b>vzdať štátnej samostatnosti</b>.",
      "Srbsko <b>odmietlo splniť všetky požiadavky</b>, tak mu Rakúsko-Uhorsko <b>28. 7. 1914</b> vypovedalo vojnu = <b>začiatok 1. svetovej vojny</b>."
    ]},
    {t:"def", n:"Ultimátum", x:"výstražný návrh sprevádzaný konkrétnou hrozbou"},

/* ===== ZVUK (Web Audio, ziadne subory) ===== */
var ac = null;
function ensureAudio(){
  if(!ac){
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(err){ ac = null; }
  }
  if(ac && ac.state === "suspended"){ ac.resume(); }
}
function beep(freq, dur, type, vol, delay){
  if(!P.sound){ return; }
  ensureAudio();
  if(!ac){ return; }
  var t = ac.currentTime + (delay || 0);
  var osc = ac.createOscillator();
  var gain = ac.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol || 0.07, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(t);
  osc.stop(t + dur + 0.03);
}

/* ===== POMOCNE FUNKCIE ===== */
function shuffle(arr){
  var i, j, tmp;
  for(i = arr.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
/* normalizacia napisanej odpovede: male pismena, bez diakritiky, bez interpunkcie */
function norm(s){
  s = (s === null || s === undefined) ? "" : String(s);
  s = s.toLowerCase().trim();
  /* NFD rozlozi pismeno na zakladne pismeno + znamienko, nasledne zahodime vsetko mimo ASCII */
  if(s.normalize){ s = s.normalize("NFD").replace(/[^\x00-\x7F]/g, ""); }
  s = s.replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  return s;
}
/* vzdialenost dvoch retazcov, aby drobny preklep nebol rovno chyba */
function lev(a, b){
  var m = a.length, n = b.length, i, j, prev, cur, tmp;
  if(m === 0){ return n; }
  if(n === 0){ return m; }
  prev = [];
  for(j = 0; j <= n; j++){ prev[j] = j; }
  for(i = 1; i <= m; i++){
    cur = [i];
    for(j = 1; j <= n; j++){
      tmp = (a.charAt(i - 1) === b.charAt(j - 1)) ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + tmp);
    }
    prev = cur;
  }
  return prev[n];
}
function txtOk(val, acc){
  var v = norm(val), i, a;
  if(!v){ return false; }
  for(i = 0; i < acc.length; i++){
    a = norm(acc[i]);
    if(v === a){ return true; }
    if(a.length > 5 && lev(v, a) <= 1){ return true; }
  }
  return false;
}

var MONTHS = [
  [/\bjanuar\w*/g, 1], [/\bfebruar\w*/g, 2], [/\bmar(ec|ca|ci|cu|com)\b/g, 3], [/\bapril\w*/g, 4],
  [/\bmaj\w*/g, 5], [/\bjun\w*/g, 6], [/\bjul\w*/g, 7], [/\baugust\w*/g, 8],
  [/\bseptemb\w*/g, 9], [/\boktob\w*/g, 10], [/\bnovemb\w*/g, 11], [/\bdecemb\w*/g, 12]
];
/* "v" tu chyba naschval: je to predlozka ("v marci"), nie rimska patka */
var ROMAN = {i:1, ii:2, iii:3, iv:4, vi:6, vii:7, viii:8, ix:9, x:10, xi:11, xii:12};
function dateNums(val){
  var s = norm(val), i, toks, out = [];
  for(i = 0; i < MONTHS.length; i++){ s = s.replace(MONTHS[i][0], " " + MONTHS[i][1] + " "); }
  toks = s.split(" ");
  for(i = 0; i < toks.length; i++){
    if(/^\d+$/.test(toks[i])){ out.push(parseInt(toks[i], 10)); }
    else if(ROMAN.hasOwnProperty(toks[i])){ out.push(ROMAN[toks[i]]); }
  }
  return out;
}
/* staci, ked koniec napisaneho datumu sedi: pri otazke na mesiac a rok sa uzna aj cely datum */
function dateOk(val, want){
  var got = dateNums(val), i, off;
  if(got.length < want.length){ return false; }
  off = got.length - want.length;
  for(i = 0; i < want.length; i++){
    if(got[off + i] !== want[i]){ return false; }
  }
  return true;
}
function escAttr(s){

/* ===== PRIPRAVA OTAZKY NA ZOBRAZENIE =====
   src drzi povodnu otazku, aby sa dala znova zamiesat bez straty spravnej odpovede */
function prepare(src){
  var q = {src:src, t:src.t, q:src.q, e:src.e, li:src.li};
  var arr = [], i, sorted, guard;
  if(src.t === "mc"){
    for(i = 0; i < src.o.length; i++){ arr.push({x:src.o[i], ok:(i === 0)}); }
    shuffle(arr);
    q.o = []; q.a = 0;
    for(i = 0; i < arr.length; i++){ q.o.push(arr[i].x); if(arr[i].ok){ q.a = i; } }
  } else if(src.t === "tf"){
    q.o = ["Pravda", "Nepravda"];
    q.a = src.a ? 0 : 1;
  } else if(src.t === "multi"){
    for(i = 0; i < src.ok.length; i++){ arr.push({x:src.ok[i], ok:true}); }
    for(i = 0; i < src.no.length; i++){ arr.push({x:src.no[i], ok:false}); }
    q.items = shuffle(arr);
  } else if(src.t === "group"){
    for(i = 0; i < src.a.length; i++){ arr.push({x:src.a[i], g:0}); }
    for(i = 0; i < src.b.length; i++){ arr.push({x:src.b[i], g:1}); }
    q.items = shuffle(arr);
    q.g = src.g;
  } else if(src.t === "order"){
    for(i = 0; i < src.o.length; i++){ arr.push({x:src.o[i], pos:i}); }
    /* nesmie vyjst uz zoradene, inak by otazka nic nepytala */
    guard = 0;
    do {
      shuffle(arr);
      sorted = true;
      for(i = 0; i < arr.length; i++){ if(arr[i].pos !== i){ sorted = false; } }
      guard++;
    } while(sorted && arr.length > 1 && guard < 20);
    q.items = arr;
  } else if(src.t === "txt"){
    q.acc = src.acc;
    q.sol = src.sol || src.acc[0];
  } else if(src.t === "date"){
    q.n = src.n;
    q.sol = src.sol;
  }
  return q;
}
function blankAns(q){
  var out = [], i;
  if(q.t === "multi"){ for(i = 0; i < q.items.length; i++){ out.push(false); } return out; }
  if(q.t === "group"){ for(i = 0; i < q.items.length; i++){ out.push(-1); } return out; }
  if(q.t === "order"){ return out; }
  if(q.t === "txt" || q.t === "date"){ return ""; }
  return -1;
}
function isOk(q, a){
  var i;
  if(q.t === "mc" || q.t === "tf"){ return a === q.a; }
  if(q.t === "multi"){
    for(i = 0; i < q.items.length; i++){ if(!!a[i] !== q.items[i].ok){ return false; } }
    return true;
  }
  if(q.t === "group"){
    for(i = 0; i < q.items.length; i++){ if(a[i] !== q.items[i].g){ return false; } }
    return true;
  }
  if(q.t === "order"){
    if(a.length !== q.items.length){ return false; }
    for(i = 0; i < a.length; i++){ if(q.items[a[i]].pos !== i){ return false; } }
    return true;
  }
  if(q.t === "txt"){ return txtOk(a, q.acc); }
  if(q.t === "date"){ return dateOk(a, q.n); }
  return false;
}
/* da sa uz odpoved skontrolovat? */
function ready(q, a){
  var i;
  if(q.t === "multi"){ for(i = 0; i < a.length; i++){ if(a[i]){ return true; } } return false; }
  if(q.t === "group"){ for(i = 0; i < a.length; i++){ if(a[i] < 0){ return false; } } return true; }
  if(q.t === "order"){ return a.length === q.items.length; }
  return true;
}
/* text spravnej odpovede a odpovede ziaka do prehladu chyb */
function solText(q){
  var out = [], i, g0 = [], g1 = [], sorted;
  if(q.t === "mc" || q.t === "tf"){ return q.o[q.a]; }
  if(q.t === "multi"){
    for(i = 0; i < q.items.length; i++){ if(q.items[i].ok){ out.push(q.items[i].x); } }
    return out.join(", ");
  }
  if(q.t === "group"){
    for(i = 0; i < q.items.length; i++){ (q.items[i].g === 0 ? g0 : g1).push(q.items[i].x); }
    return "<b>" + q.g[0] + ":</b> " + g0.join(", ") + "<br><b>" + q.g[1] + ":</b> " + g1.join(", ");
  }
  if(q.t === "order"){
    sorted = q.items.slice().sort(function(x, y){ return x.pos - y.pos; });
    for(i = 0; i < sorted.length; i++){ out.push((i + 1) + ". " + sorted[i].x); }
    return out.join("<br>");
  }
  return q.sol;
}
function yourText(q, a){
  var out = [], i;
  if(q.t === "mc" || q.t === "tf"){ return q.o[a]; }
  if(q.t === "multi"){
    for(i = 0; i < q.items.length; i++){ if(a[i]){ out.push(q.items[i].x); } }
    return out.join(", ");
  }
  if(q.t === "group"){
    for(i = 0; i < q.items.length; i++){
      if(a[i] !== q.items[i].g){ out.push(q.items[i].x + " → " + q.g[a[i]]); }
    }
    return out.join(", ");
  }
  if(q.t === "order"){
    for(i = 0; i < a.length; i++){ out.push((i + 1) + ". " + q.items[a[i]].x); }
    return out.join("<br>");
  }
  return escAttr(String(a).trim()) || "(nič)";
}

/* ===== SKUSANIE (spolocne pre skusku z temy, opravu chyb aj velky test) ===== */
function startRun(kind, li, list){
  var qs = [], i;
  shuffle(list);
  for(i = 0; i < list.length; i++){ qs.push(prepare(list[i])); }
  S.run = {kind:kind, li:li, qs:qs, i:0, ans:blankAns(qs[0]), locked:false, log:[]};
  S.screen = "run";
  render();
}
/* velky test berie otazky z tem postupne dokola, aby bola zastupena kazda tema */
function pickFinal(count){
  var pools = [], order = [], out = [], i, any = true;
  for(i = 0; i < LESSONS.length; i++){
    pools.push(shuffle(LESSONS[i].qs.slice()));
    order.push(i);
  }
  if(!count || count > ALLQ.length){ count = ALLQ.length; }
  while(out.length < count && any){
    any = false;
    shuffle(order);
    for(i = 0; i < order.length && out.length < count; i++){
      if(pools[order[i]].length){ out.push(pools[order[i]].pop()); any = true; }
    }
  }
  return out;
}
function viewRun(fresh){
  var R = S.run, q = R.qs[R.i], last = (R.i === R.qs.length - 1);
  setAccent(R.kind === "final" || R.li < 0 ? 3 : R.li);
  var label = (R.kind === "final") ? "Veľký test" : (R.kind === "fix" ? "Oprava chýb" : "Skúška &middot; téma " + (R.li + 1));
  var pct = Math.round(((R.i + (R.locked ? 1 : 0)) / R.qs.length) * 100);
  var html = topbar(label) +
    '<div class="card">' +
      '<div class="kicker">' + label + '</div>' +
      '<div class="small muted">Otázka ' + (R.i + 1) + ' z ' + R.qs.length + ' &middot; správne: ' + countOk(R.log) + ' &middot; ' + KIND[q.t] + '</div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '<h2>' + q.q + '</h2>' +
      questionHtml(q, R.ans, R.locked) +
      (R.locked ? '<div class="row" style="margin-top:14px;"><button class="btn wide" data-act="next" id="nextbtn">' +
        (last ? (R.kind === "final" ? "Vyhodnotiť test" : "Ukázať výsledok") : "Ďalej &#8594;") + '</button></div>' : '') +
    '</div>';
  app.innerHTML = html;
  if(fresh){
    window.scrollTo(0, 0);
    focusInput();
  } else if(R.locked){
    var nb = document.getElementById("nextbtn");
    if(nb && nb.scrollIntoView){ nb.scrollIntoView({block:"nearest", behavior:"smooth"}); }
  }
}
function lockRun(){
  var R = S.run, q = R.qs[R.i], ok = isOk(q, R.ans);
  R.locked = true;
  R.log.push({q:q, ans:R.ans, ok:ok});
  if(ok){ sGood(); } else { sBad(); }
  viewRun(false);
}
function finishRun(){
  var R = S.run, total = R.log.length, correct = countOk(R.log), id, prev, pct;
  if(R.kind === "quiz"){
    id = LESSONS[R.li].id;
    prev = P.quiz[id];
    if(!prev || prev.total !== total || correct > prev.best){ P.quiz[id] = {best:correct, total:total}; }
    saveProgress();
    S.screen = "quizres";
  } else if(R.kind === "fix"){
    S.screen = "quizres";
  } else {
    pct = Math.round((correct / total) * 100);
    if(!P.fin || pct > P.fin.pct){ P.fin = {pct:pct, grade:gradeOf(pct)}; }
    saveProgress();
    S.screen = "result";
  }
  sWin();
  render();
}

      '</div>' +
      '<p>' + msg + '</p>' +
      '<div class="col">';
  if(wrong > 0){
    html += '<button class="btn ' + (ok && R.kind !== "fix" ? "ghost" : "") + ' wide" data-act="fix">Opraviť chyby (' + wrong + ')</button>';
  }
  if(fromFinal){
    html += '<button class="btn wide" data-act="final">Nový veľký test</button>';
  } else {
    if(ok){
      html += isLast ?
        '<button class="btn big wide" data-act="final">Ísť na veľký test &#8594;</button>' :
        '<button class="btn big wide" data-act="lesson" data-val="' + (R.li + 1) + '">Ďalšia téma &#8594;</button>';
    }
    html += '<button class="btn ghost wide" data-act="quiz">Celá skúška znova</button>' +
      '<button class="btn grey wide" data-act="lesson" data-val="' + R.li + '">Späť na výklad</button>';
    if(!ok && !isLast){
      html += '<button class="linkbtn" data-act="lesson" data-val="' + (R.li + 1) + '">Ísť na ďalšiu tému aj tak</button>';
    }
  }
  html += '</div></div>';
  if(wrong > 0){
    html += '<div class="card"><h2>Prehľad chýb</h2>' + missHtml(R.log, fromFinal) + '</div>';
  }
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===== OBRAZOVKA: VYSLEDOK VELKEHO TESTU ===== */
function viewResult(){
  var R = S.run, total = R.log.length, correct = countOk(R.log), wrong = total - correct;
  var pct = total ? Math.round((correct / total) * 100) : 0;
  var g = gradeOf(pct), i, by = [], it, html;
  setAccent(g <= 2 ? 1 : (g === 3 ? 0 : 2));
  for(i = 0; i < LESSONS.length; i++){ by.push({c:0, t:0}); }
  for(i = 0; i < R.log.length; i++){
    it = R.log[i];
    by[it.q.li].t++;
    if(it.ok){ by[it.q.li].c++; }
  }
  html = topbar("Výsledok") +
    '<div class="card"><h1 style="text-align:center;">Tvoja známka</h1>' +
    '<div class="grade">' + g + '</div>' +
    '<p style="text-align:center;font-weight:700;">' + gradeWord(g) + '</p>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + pct + ' %</b>úspešnosť</div>' +
      '<div class="stat"><b>' + correct + '</b>správne</div>' +
      '<div class="stat"><b>' + wrong + '</b>chyby</div>' +
    '</div>' +
    '<div class="col">' +
      (wrong > 0 ? '<button class="btn wide" data-act="fix">Opraviť chyby (' + wrong + ')</button>' : '') +
      '<button class="btn ' + (wrong > 0 ? "ghost" : "") + ' wide" data-act="final">Nový veľký test</button>' +
      '<button class="btn grey wide" data-act="home">Menu</button>' +
    '</div></div>';
  html += '<div class="card"><h2>Ako ti išli témy</h2>';
  for(i = 0; i < LESSONS.length; i++){
    if(!by[i].t){ continue; }
    html += '<div class="trow"><div class="tn">' + (i + 1) + '. ' + LESSONS[i].title + '</div>' +
      '<div class="ts ' + (by[i].c === by[i].t ? "full" : "part") + '">' + by[i].c + ' / ' + by[i].t + '</div>' +
      (by[i].c === by[i].t ? '' : '<button class="btn grey small" data-act="lesson" data-val="' + i + '">Zopakovať</button>') +
      '</div>';
  }
  html += '</div>';
  if(wrong > 0){
    html += '<div class="card"><h2>Prehľad chýb</h2>' + missHtml(R.log, true) + '</div>';
  } else {
    html += '<div class="card center"><h2>Bez chyby! &#127881;</h2><p class="muted">Všetko správne. Na písomku si pripravený.</p></div>';
  }
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===== OBRAZOVKA: TAHAK ===== */
function viewCheat(){
  setAccent(4);
  var html = topbar("Ťahák"), i;
  html += '<div class="card"><h2>&#128197; Dátumy</h2><div class="cheat wide">';
  for(i = 0; i < TIMELINE.length; i++){
    html += '<div class="k">' + TIMELINE[i][0] + '</div><div>' + TIMELINE[i][1] + '</div>';
  }
  html += '</div></div><div class="card"><h2>&#128100; Osobnosti</h2><div class="cheat wide">';
  for(i = 0; i < PEOPLE.length; i++){
    html += '<div class="k" style="white-space:normal;">' + PEOPLE[i][0] + '</div><div>' + PEOPLE[i][1] + '</div>';
  }
  html += '</div></div><div class="card"><h2>&#128214; Pojmy a zoznamy</h2><div class="cheat wide">';
  for(i = 0; i < TERMS.length; i++){
    html += '<div class="k" style="white-space:normal;">' + TERMS[i][0] + '</div><div>' + TERMS[i][1] + '</div>';
  }
  html += '</div></div>' + mapHtml("1914") + mapHtml("1919") +
    '<div class="dock"><button class="btn" data-act="home">Späť do menu</button></div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===== ROUTER ===== */
function render(){
  if(S.screen === "home"){ viewHome(); }
  else if(S.screen === "lesson"){ viewLesson(); }
  else if(S.screen === "run"){ viewRun(true); }
  else if(S.screen === "quizres"){ viewQuizRes(); }
  else if(S.screen === "result"){ viewResult(); }
  else if(S.screen === "cheat"){ viewCheat(); }
}

/* ===== OVLADANIE (delegovanie udalosti, ziadne inline handlery) ===== */
app.addEventListener("click", function(ev){
  var el = ev.target;
  while(el && el !== app && !(el.getAttribute && el.getAttribute("data-act"))){ el = el.parentNode; }
  if(!el || el === app || el.disabled){ return; }
  handle(el.getAttribute("data-act"), el.getAttribute("data-val"));
});
app.addEventListener("keydown", function(ev){
  if(ev.key !== "Enter" && ev.keyCode !== 13){ return; }
  var t = ev.target;
  if(!t){ return; }
  /* Enter v poli na pisanu odpoved funguje ako tlacidlo Skontrolovat */
  if(t.id === "txtin"){ ev.preventDefault(); handle("check"); return; }
  if(t.className === "logo"){ handle("home"); }
});

/* rozbehnuty velky test sa neopusta bez opytania */
function leaveOk(){
  var R = S.run;
  if(S.screen === "run" && R && R.kind === "final" && R.log.length > 0){
    return window.confirm("Veľký test ešte nie je dokončený. Naozaj ho chceš ukončiť?");
  }
  return true;
}

function handle(act, val){
  var R = S.run, q, i, parts, inp, list;
  if(act === "home"){
    if(!leaveOk()){ return; }
    S.screen = "home"; sClick(); render(); return;
  }
  if(act === "sound"){
    P.sound = !P.sound;
    saveProgress();
    if(P.sound){ ensureAudio(); sClick(); }
    if(S.screen === "run"){ viewRun(false); } else { render(); }
    return;
  }
  if(act === "lesson"){ S.li = parseInt(val, 10); S.screen = "lesson"; sClick(); render(); return; }
  if(act === "cheat"){ S.screen = "cheat"; sClick(); render(); return; }
  if(act === "cnt"){ S.cnt = parseInt(val, 10); sClick(); render(); return; }
  if(act === "reset"){
    if(window.confirm("Naozaj vymazať celý pokrok?")){
      P.quiz = {}; P.fin = null;
      saveProgress();
      render();
    }
    return;
  }
  if(act === "quiz"){
    /* zo stranky s vysledkom sa opakuje ta ista tema, z vykladu otvorena tema */
    i = (S.screen === "quizres" && R && R.li >= 0) ? R.li : S.li;
    S.li = i;
    sClick();
    startRun("quiz", i, LESSONS[i].qs.slice());
    return;
  }
  if(act === "final"){ sClick(); startRun("final", -1, pickFinal(S.cnt)); return; }
  if(act === "fix"){
    list = [];
    for(i = 0; i < R.log.length; i++){ if(!R.log[i].ok){ list.push(R.log[i].q.src); } }
    if(!list.length){ return; }
    sClick();
    startRun("fix", (R.kind === "final") ? -1 : R.li, list);
    return;
  }
  if(!R || S.screen !== "run"){ return; }
  q = R.qs[R.i];
  if(act === "next"){
    if(!R.locked){ return; }
    if(R.i === R.qs.length - 1){ finishRun(); return; }
    R.i++;
    R.ans = blankAns(R.qs[R.i]);
    R.locked = false;
    viewRun(true);
    return;
  }
  if(R.locked){ return; }
  if(act === "pick"){ R.ans = parseInt(val, 10); lockRun(); return; }
  if(act === "tog"){ i = parseInt(val, 10); R.ans[i] = !R.ans[i]; viewRun(false); return; }
  if(act === "grp"){
    parts = val.split(":");
    R.ans[parseInt(parts[0], 10)] = parseInt(parts[1], 10);
    viewRun(false);
    return;
  }
  if(act === "ord"){
    i = parseInt(val, 10);
    if(R.ans.indexOf(i) >= 0){ R.ans.splice(R.ans.indexOf(i), 1); } else { R.ans.push(i); }
    viewRun(false);
    return;
  }
  if(act === "check"){
    if(q.t === "txt" || q.t === "date"){
      inp = document.getElementById("txtin");
      if(!inp || !inp.value.replace(/\s/g, "")){ if(inp){ inp.focus(); } return; }
      R.ans = inp.value;
    } else if(!ready(q, R.ans)){ return; }
    lockRun();
    return;
  }
}

loadProgress();
render();

/* offline: po prvom otvoreni sa appka ulozi do telefonu */
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(){ /* bez offline rezimu appka funguje dalej */ });
  });
}
</script>
