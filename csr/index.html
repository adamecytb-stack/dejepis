<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vznik ČSR – dejepis</title>
<meta name="description" content="Učebná appka z dejepisu: Slováci v 1. svetovej vojne, odboj, vznik Česko-Slovenska, Trianon, Bratislava. Výklad, skúška po každej téme a veľký test.">
<meta name="theme-color" content="#15803d">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Vznik ČSR">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">
<style>
  :root{
    --accent:#2563eb;
    --soft:#e8f0ff;
    --ink:#1b2333;
    --muted:#5d6b85;
    --ok:#15803d;
    --bad:#dc2626;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html{-webkit-text-size-adjust:100%;}
  body{
    margin:0;
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
    color:var(--ink);
    background:#f1f6f2;
    min-height:100vh;
    line-height:1.5;
  }
  /* prechod na pozadi je na pevnej vrstve, lebo background-attachment:fixed na iPhone nefunguje */
  body::before{
    content:"";position:fixed;top:0;left:0;right:0;bottom:0;z-index:-1;
    background:linear-gradient(160deg,#ecf8f0 0%,#eef4ff 50%,#fff3e8 100%);
  }
  .wrap{
    max-width:720px;margin:0 auto;
    padding:16px 14px 56px;
    padding-left:max(14px, env(safe-area-inset-left));
    padding-right:max(14px, env(safe-area-inset-right));
  }
  .topbar{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .topbar .pill{display:none;white-space:nowrap;}
  .logo{
    font-size:22px;font-weight:800;letter-spacing:-0.5px;cursor:pointer;
    background:linear-gradient(90deg,#15803d,#2563eb 55%,#be123c);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .spacer{flex:1;}
  .card{
    background:#fff;border-radius:18px;padding:18px;
    box-shadow:0 10px 26px rgba(29,45,86,.10);
    margin-bottom:14px;
  }
  .card.center{text-align:center;}
  a.card{display:block;text-decoration:none;color:inherit;}
  h1{font-size:25px;line-height:1.2;margin:0 0 6px;}
  h2{font-size:20px;line-height:1.3;margin:0 0 10px;}
  h3{font-size:17px;margin:0 0 8px;}
  h4{font-size:15px;margin:0 0 6px;}
  p{margin:0 0 10px;}
  .muted{color:var(--muted);}
  .small{font-size:14px;}
  .kicker{font-size:13px;font-weight:800;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);margin-bottom:4px;}
  .btn{
    display:inline-flex;align-items:center;gap:8px;justify-content:center;
    padding:13px 20px;border:none;border-radius:14px;cursor:pointer;
    font-size:16px;font-weight:700;font-family:inherit;line-height:1.25;
    background:var(--accent);color:#fff;
    box-shadow:0 4px 12px rgba(29,45,86,.18);
    transition:transform .08s ease, filter .15s ease;
  }
  .btn:active{transform:scale(.98);}
  .btn.ghost{background:#fff;color:var(--accent);border:2px solid var(--accent);box-shadow:none;padding:11px 18px;}
  .btn.grey{background:#eef1f7;color:#41506b;box-shadow:none;}
  .btn.big{font-size:18px;padding:16px 22px;border-radius:16px;}
  .btn.small{font-size:14px;padding:8px 14px;border-radius:10px;}
  .btn.wide{width:100%;}
  .btn:disabled{opacity:.45;cursor:default;transform:none;}
  .row{display:flex;gap:10px;flex-wrap:wrap;}
  .col{display:flex;flex-direction:column;gap:10px;}
  .btnrow{display:flex;gap:10px;margin-top:14px;}
  .btnrow .btn{flex:1;}
  .btnrow .btn.grey{flex:0 0 auto;}
  .pill{
    display:inline-block;padding:5px 12px;border-radius:999px;
    background:var(--soft);color:var(--accent);font-weight:700;font-size:14px;
  }
  .sound{
    border:2px solid #dfe5f1;background:#fff;border-radius:12px;width:44px;height:40px;
    font-size:18px;cursor:pointer;
  }
  .bar{height:12px;border-radius:999px;background:#e5eaf4;overflow:hidden;margin:10px 0 6px;}
  .bar span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s ease;}

  /* ---- cesta temami ---- */
  .path{display:flex;flex-direction:column;gap:10px;margin-bottom:14px;}
  .step{
    display:flex;align-items:center;gap:14px;width:100%;text-align:left;
    font-family:inherit;font-size:16px;color:inherit;cursor:pointer;
    background:#fff;border-radius:18px;padding:13px 14px;
    box-shadow:0 6px 18px rgba(29,45,86,.08);
    border:2px solid transparent;
  }
  .step .num{
    flex:0 0 44px;height:44px;border-radius:14px;background:var(--soft);color:var(--accent);
    font-weight:800;font-size:18px;display:flex;align-items:center;justify-content:center;
  }
  .step.done .num{background:#e3f6ea;color:var(--ok);}
  .step.next{border-color:var(--accent);}
  .step .tt{font-weight:700;line-height:1.3;}
  .step .ss{font-size:13.5px;color:var(--muted);line-height:1.35;margin-top:2px;}
  .step .chev{margin-left:auto;color:#a8b3c9;font-size:24px;flex:0 0 auto;}
  .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0 14px;}
  .tab{
    border:2px solid #dfe5f1;background:#fff;border-radius:999px;padding:8px 16px;
    font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;color:#41506b;
  }
  .tab.on{background:var(--accent);border-color:var(--accent);color:#fff;}
  .linkbtn{background:none;border:none;padding:0;font:inherit;color:var(--muted);text-decoration:underline;cursor:pointer;}

  /* ---- vyklad ---- */
  .pts{margin:0;padding-left:20px;}
  .pts li{margin-bottom:8px;}
  .pts li:last-child{margin-bottom:0;}
  /* zlte zvyraznenie = toto treba vediet na pisomku */
  .lesson .pts b, .lesson .dates b, .lesson .term b, .lesson .two b, .lesson .g4 b{
    color:var(--ink);
    background:linear-gradient(transparent 56%, #fde68a 56%);
    padding:0 1px;
  }
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .two .side{background:var(--soft);border-radius:14px;padding:12px;}
  .two .side.b{background:#fff3e8;}
  .two .side h4{color:var(--accent);}
  .two .side.b h4{color:#c2410c;}
  .two ul{margin:0;padding-left:18px;}
  .two li{margin-bottom:6px;}
  .term{
    border-left:6px solid var(--accent);background:var(--soft);
    border-radius:0 14px 14px 0;padding:12px 14px;
  }
  .term h3{color:var(--accent);margin-bottom:2px;}
  .term p{margin:0;}
  .note{border-radius:14px;padding:12px 14px;margin-bottom:14px;font-size:15.5px;}
  .note.tip{background:#fffbea;border:2px solid #f5d67a;}
  .note.easy{background:#eef6ff;border:2px solid #bcd7fb;}
  .note.warn{background:#fff1e8;border:2px solid #f3a874;}
  .note.extra{background:#fff;border:2px dashed #a8b3c9;}
  .note .nh{font-weight:800;display:block;margin-bottom:2px;}
  .dates{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline;}
  .dates .d{font-weight:800;color:var(--accent);}
  .must{border:2px solid var(--accent);}
  .g4{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
  .g4 .cell{border-radius:14px;padding:12px;}
  .g4 h4{display:flex;align-items:baseline;gap:6px;margin-bottom:6px;}
  .g4 .big{font-size:26px;font-weight:900;line-height:1;}
  .g4 ul{margin:0;padding-left:18px;}
  .g4 li{margin-bottom:4px;}
  .g4 .s{background:#e6f6ec;} .g4 .s h4{color:#15803d;}
  .g4 .w{background:#ffe9ee;} .g4 .w h4{color:#be123c;}
  .g4 .o{background:#e8f0ff;} .g4 .o h4{color:#2563eb;}
  .g4 .t{background:#fff1e6;} .g4 .t h4{color:#c2410c;}
  .dock{
    position:-webkit-sticky;position:sticky;bottom:0;z-index:5;display:flex;gap:10px;
    margin:0 -14px;padding:10px 14px;
    padding-bottom:max(10px, env(safe-area-inset-bottom));
    background:rgba(255,255,255,.94);border-top:1px solid #e3e8f2;
  }
  .dock .btn{flex:1;}
  .dock .btn.grey{flex:0 0 auto;}

  /* ---- schematicka mapa ---- */
  .map{display:grid;grid-auto-rows:46px;gap:5px;margin:6px 0 10px;}
  .tile{
    border-radius:10px;display:flex;align-items:center;justify-content:center;text-align:center;
    font-weight:800;font-size:12px;line-height:1.15;padding:2px 3px;color:#fff;overflow:hidden;
  }
  .tile.csr{background:#15803d;}
  .tile.ally{background:#2563eb;}
  .tile.foe{background:#c2410c;}
  .tile.n{background:#e5eaf4;color:#41506b;}
  .legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;color:var(--muted);}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;margin-right:6px;vertical-align:-1px;}

  /* ---- otazky ---- */
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .opt{
    text-align:left;font-family:inherit;font-size:16px;cursor:pointer;color:inherit;
    background:#f5f7fb;border:2px solid #e3e8f2;border-radius:14px;
    padding:12px 14px;display:flex;gap:10px;align-items:flex-start;width:100%;
  }
  .opt .lettr{
    flex:0 0 28px;height:28px;border-radius:8px;background:#fff;
    border:2px solid #d7deec;display:flex;align-items:center;justify-content:center;
    font-weight:800;font-size:14px;
  }
  .opt .tag{margin-left:auto;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.3px;white-space:nowrap;padding-top:5px;color:var(--bad);}
  .opt.on{border-color:var(--ink);background:#eef1f7;}
  .opt.on .lettr{background:var(--ink);border-color:var(--ink);color:#fff;}
  .opt.correct{background:#e7f8ee;border-color:var(--ok);}
  .opt.correct .lettr{background:#fff;border-color:var(--ok);color:var(--ok);}
  .opt.wrong{background:#fdecec;border-color:var(--bad);}
  .opt.wrong .lettr{background:#fff;border-color:var(--bad);color:var(--bad);}
  .opt:disabled{cursor:default;color:inherit;opacity:1;}
  .txtin{
    width:100%;min-width:0;font-family:inherit;font-size:17px;font-weight:600;
    padding:11px 13px;border-radius:13px;border:2px solid #d7deec;background:#f5f7fb;color:var(--ink);
    outline:none;
  }
  .txtin:focus{border-color:var(--accent);background:#fff;}
  .txtin.okin{border-color:var(--ok);background:#e7f8ee;}
  .txtin.badin{border-color:var(--bad);background:#fdecec;}
  .txtin:disabled{opacity:1;-webkit-text-fill-color:var(--ink);}
  .one{margin-top:14px;}
  .flds{display:flex;flex-direction:column;gap:10px;margin-top:14px;}
  .fld label{display:block;font-size:14.5px;font-weight:700;color:#41506b;margin-bottom:4px;}
  .fld.inl{display:flex;align-items:center;gap:8px;}
  .fld.inl label{flex:0 0 22px;margin:0;text-align:right;color:var(--muted);}
  .fld .fs{display:block;font-size:14px;color:var(--ok);margin-top:3px;}
  .hint{font-size:14px;color:var(--muted);margin-top:8px;}
  .fb{border-radius:14px;padding:14px 16px;margin-top:14px;}
  .fb.ok{background:#e7f8ee;border:2px solid var(--ok);}
  .fb.no{background:#fdecec;border:2px solid var(--bad);}
  .fb .head{font-weight:800;margin-bottom:4px;}
  .fb.ok .head{color:var(--ok);}
  .fb.no .head{color:var(--bad);}
  .over{margin-top:10px;font-size:15px;}

  /* ---- vysledky ---- */
  .bigico{font-size:52px;line-height:1;margin-bottom:6px;}
  .grade{
    font-size:72px;font-weight:900;line-height:1;text-align:center;
    background:linear-gradient(90deg,#15803d,#2563eb);
    -webkit-background-clip:text;background-clip:text;color:transparent;
  }
  .stats{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:14px 0;}
  .stat{background:var(--soft);border-radius:14px;padding:10px 14px;text-align:center;min-width:92px;font-size:14px;}
  .stat b{display:block;font-size:22px;}
  .miss{border-left:5px solid var(--bad);background:#fff6f6;border-radius:0 12px 12px 0;padding:12px 14px;margin-bottom:10px;}
  .miss .lbl{font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;}
  .trow{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid #edf0f6;}
  .trow:first-of-type{border-top:none;}
  .trow .tn{flex:1;min-width:0;line-height:1.3;}
  .trow .ts{font-weight:800;white-space:nowrap;}
  .trow .ts.full{color:var(--ok);}
  .trow .ts.part{color:var(--bad);}
  .cheat{display:grid;grid-template-columns:auto 1fr;gap:8px 12px;align-items:baseline;}
  .cheat .k{font-weight:800;color:var(--accent);}

  @media (hover:hover){
    .btn:hover:enabled{filter:brightness(1.07);}
    .opt:hover:enabled{border-color:var(--accent);}
    .step:hover, a.card:hover{border-color:var(--accent);}
  }
  button:focus-visible, .logo:focus-visible, a:focus-visible{outline:3px solid #1b2333;outline-offset:2px;}
  @media (min-width:560px){
    .wrap{padding-top:22px;}
    .card{padding:22px;}
    .map{grid-auto-rows:54px;}
    .tile{font-size:14px;}
    .logo{font-size:26px;}
    .topbar .pill{display:inline-block;}
  }
  @media (max-width:420px){
    .cheat, .dates.stack{grid-template-columns:1fr;gap:0;}
    .cheat .k, .dates.stack .d{margin-top:8px;}
    .two{grid-template-columns:1fr;}
    .tile{font-size:11px;}
  }
  @media (max-width:440px){
    .g4{grid-template-columns:1fr;}
  }
  @media (prefers-reduced-motion:reduce){
    .btn, .bar span{transition:none;}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* ============================================================
   UCEBNA APLIKACIA - DEJEPIS: VZNIK CESKO-SLOVENSKA
   Obsah je zo zosita (dve sady poznamok od spoluziakov).
   Bloky "extra" su dovysvetlenie navyse, v zosite nie su.
   ============================================================ */

/* ===== FARBY TEM ===== */
var PAL = [
  {c:"#2563eb", s:"#e8f0ff"},
  {c:"#15803d", s:"#e6f6ec"},
  {c:"#c2410c", s:"#fff1e6"},
  {c:"#7c3aed", s:"#f2ecff"},
  {c:"#0e7490", s:"#e3f5f9"},
  {c:"#be123c", s:"#ffe9ee"},
  {c:"#a16207", s:"#fdf5e1"},
  {c:"#4f46e5", s:"#eef0ff"},
  {c:"#047857", s:"#e2f6ef"}
];
/* skuska z temy je zvladnuta od 80 % */
var PASS = 0.8;

/* ===== DATA: TEMY (vyklad + otazky) =====
   Bloky: list, num (cislovany zoznam), two, def, dates, g4 (SWOT), map, easy, tip, warn, extra
   Typy otazok (vsetky okrem order su pisane):
   txt   - napis odpoved; acc su uznane tvary, kw su skupiny klucovych slov
           (staci, ked je v odpovedi z kazdej skupiny aspon jedno); own = vlastnymi slovami
   date  - pisany datum, "n" su ocakavane cisla [den, mesiac, rok] alebo [mesiac, rok] alebo [rok]
   list  - vymenuj n veci v lubovolnom poradi; polozka {s, acc, kw}
   pairs - viac poli s popisom "l", ku kazdemu jedna odpoved {l, s, acc, kw}
   order - zorad, pole "o" je v spravnom poradi */
var LESSONS = [
{
  id:"vojna",
  title:"Svetová vojna a Slováci",
  short:"R-U sa rozpadá, politická pasivita, 3 plány pre Slovensko",
  intro:"Slováci počas vojny žili v Rakúsko-Uhorsku, ale väčšina z nich ho nepodporovala. Už počas vojny sa rozmýšľalo, ku komu sa Slovensko po vojne pripojí.",
  blocks:[
    {t:"list", h:"Rakúsko-Uhorsko sa rozpadalo zvnútra", li:[
      "Rakúsko-Uhorsko bolo <b>mnohonárodnostný štát</b>.",
      "Jednotlivé národy sa usilovali dosiahnuť <b>svoje ciele bez ohľadu na záujmy monarchie</b> – to <b>oslabovalo ríšu, až zanikla</b>.",
      "<b>Vládna propaganda</b> propagovala vojnu."
    ]},
    {t:"easy", x:"<b>Mnohonárodnostný</b> = žilo v ňom veľa národov: Rakúšania, Maďari, Česi, Slováci, Poliaci, Chorváti… Predstav si skupinový projekt, kde každý ťahá za svoje a na spoločný výsledok kašle. Presne tak sa ríša oslabovala, až sa rozpadla."},
    {t:"list", h:"Slováci počas vojny", li:[
      "Slováci boli skôr <b>na strane nepriateľov R-U – Ruska a Srbska</b>.",
      "<b>Maďarská vrchnosť prenasledovala</b> slovenských národovcov.",
      "Slovenskí politici preto vyhlásili <b>politickú pasivitu</b>.",
      "Slováci bojovali na <b>balkánskom, ruskom a talianskom fronte</b>.",
      "Viacerí slovenskí vojaci <b>dobrovoľne prešli do zajatia k nepriateľom</b>."
    ]},
    {t:"easy", x:"<b>Politická pasivita</b> = slovenskí politici prestali verejne robiť politiku a stiahli sa. Pasívny = nič nerobí. Keď ťa za každé slovo môžu zavrieť, radšej mlčíš a čakáš, ako to dopadne."},
    {t:"num", h:"Plány na povojnové pripojenie Slovenska", li:[
      "pripojenie <b>k Rusku</b>",
      "vytvorenie <b>poľsko-česko-slovenskej federácie</b>",
      "spojenie <b>Slovenska a Česka do jedného spoločného štátu</b>"
    ]},
    {t:"tip", x:"Plány sa zmenšujú: obrovské <b>Rusko</b> → traja (<b>Poliaci, Česi, Slováci</b>) → dvaja (<b>Česi a Slováci</b>). Vyhral ten posledný – vznikla ČSR."},
    {t:"tip", x:"Rusi a Srbi sú tiež <b>Slovania</b> ako Slováci. Preto Slováci držali palce skôr im ako Rakúsko-Uhorsku."}
  ],
  must:[
    "Rakúsko-Uhorsko = mnohonárodnostný štát; národy išli za svojimi cieľmi, a tak ríša zanikla",
    "Slováci boli skôr na strane Ruska a Srbska",
    "Maďarská vrchnosť prenasledovala národovcov → politici vyhlásili politickú pasivitu",
    "3 plány: k Rusku / poľsko-česko-slovenská federácia / spoločný štát s Čechmi",
    "Fronty: balkánsky, ruský, taliansky; vojaci dobrovoľne prechádzali do zajatia"
  ],
  qs:[
    {t:"txt", q:"Aký štát bolo Rakúsko-Uhorsko podľa toho, kto v ňom žil?", acc:["mnohonárodnostný","mnohonárodnostný štát","mnohonárodný","mnohonárodný štát"], kw:[["mnohonar"]], sol:"mnohonárodnostný štát",
     e:"Rakúsko-Uhorsko bolo mnohonárodnostný štát – žilo v ňom veľa národov."},
    {t:"txt", own:true, q:"Prečo sa Rakúsko-Uhorsko oslabovalo, až zaniklo?", kw:[["narod"],["ciel","zaujm","svoj","chcel"]],
     sol:"jednotlivé národy sa usilovali dosiahnuť svoje ciele bez ohľadu na záujmy monarchie",
     e:"Každý národ išiel za svojím a na monarchiu nehľadel. To ríšu oslabovalo, až zanikla."},
    {t:"txt", q:"Čo propagovala vládna propaganda?", acc:["vojnu","vojna"], sol:"vojnu",
     e:"Vládna propaganda propagovala vojnu."},
    {t:"list", q:"Na strane ktorých dvoch nepriateľov Rakúsko-Uhorska boli Slováci skôr?", n:2,
     items:[{s:"Rusko", kw:[["rus"]]},{s:"Srbsko", kw:[["srb"]]}],
     e:"Slováci boli skôr na strane Ruska a Srbska."},
    {t:"txt", q:"Kto prenasledoval slovenských národovcov?", acc:["maďarská vrchnosť","Maďari","maďarská vláda","maďarská šľachta"], kw:[["vrchnost"]], sol:"maďarská vrchnosť",
     e:"Slovenských národovcov prenasledovala maďarská vrchnosť."},
    {t:"txt", q:"Čo vyhlásili slovenskí politici, keď ich prenasledovali?", acc:["politickú pasivitu","pasivitu"], kw:[["pasiv"]], sol:"politickú pasivitu",
     e:"Slovenskí politici vyhlásili politickú pasivitu – stiahli sa z politiky."},
    {t:"list", q:"Vymenuj 3 plány na povojnové pripojenie Slovenska.", n:3,

/* ===== ZVUK (Web Audio, ziadne subory) ===== */
var ac = null;
function ensureAudio(){
  if(!ac){
    try { ac = new (window.AudioContext || window.webkitAudioContext)(); }
    catch(err){ ac = null; }
  }
  if(ac && ac.state === "suspended"){ ac.resume(); }
}
function beep(freq, dur, type, vol, delay){
  if(!P.sound){ return; }
  ensureAudio();
  if(!ac){ return; }
  var t = ac.currentTime + (delay || 0);
  var osc = ac.createOscillator();
  var gain = ac.createGain();
  osc.type = type || "sine";
  osc.frequency.setValueAtTime(freq, t);
  gain.gain.setValueAtTime(vol || 0.07, t);
  gain.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  osc.connect(gain);
  gain.connect(ac.destination);
  osc.start(t);
  osc.stop(t + dur + 0.03);
}

/* ===== POMOCNE FUNKCIE ===== */
function shuffle(arr){
  var i, j, tmp;
  for(i = arr.length - 1; i > 0; i--){
    j = Math.floor(Math.random() * (i + 1));
    tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
/* normalizacia napisanej odpovede: male pismena, bez diakritiky, bez interpunkcie */
function norm(s){
  s = (s === null || s === undefined) ? "" : String(s);
  s = s.toLowerCase().trim();
  if(s.normalize){ s = s.normalize("NFD").replace(/[̀-ͯ]/g, ""); }
  s = s.replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ").trim();
  return s;
}
/* vzdialenost dvoch retazcov, aby drobny preklep nebol rovno chyba */
function lev(a, b){
  var m = a.length, n = b.length, i, j, prev, cur, tmp;
  if(m === 0){ return n; }
  if(n === 0){ return m; }
  prev = [];
  for(j = 0; j <= n; j++){ prev[j] = j; }
  for(i = 1; i <= m; i++){
    cur = [i];
    for(j = 1; j <= n; j++){
      tmp = (a.charAt(i - 1) === b.charAt(j - 1)) ? 0 : 1;
      cur[j] = Math.min(prev[j] + 1, cur[j - 1] + 1, prev[j - 1] + tmp);
    }
    prev = cur;
  }
  return prev[n];
}
/* presna zhoda alebo maly preklep (dlhsie slova znesu viac); zaciatok slova musi sediet,
   inak by "decentralisticka" presla ako "centralisticka" */
function accOk(val, acc){
  var v = norm(val), i, a;
  if(!v || !acc){ return false; }
  for(i = 0; i < acc.length; i++){
    a = norm(acc[i]);
    if(!a){ continue; }
    if(v === a){ return true; }
    /* pri cislach preklep neplati: 10 000 nie je 100 000 */
    if(/\d/.test(a)){ if(v.replace(/ /g, "") === a.replace(/ /g, "")){ return true; } continue; }
    if(v.slice(0, 2) !== a.slice(0, 2)){ continue; }
    if(a.length > 5 && lev(v, a) <= 1){ return true; }
    if(a.length > 11 && lev(v, a) <= 2){ return true; }
  }
  return false;
}
/* klucove slova: z kazdej skupiny musi byt v odpovedi aspon jedno */
function kwOk(val, kw){
  var v = norm(val), i, j, hit;
  if(!v || !kw || !kw.length){ return false; }
  for(i = 0; i < kw.length; i++){
    hit = false;
    for(j = 0; j < kw[i].length; j++){ if(v.indexOf(kw[i][j]) >= 0){ hit = true; } }
    if(!hit){ return false; }
  }
  return true;
}
function itemOk(val, it){ return accOk(val, it.acc) || kwOk(val, it.kw); }
/* zoznam: kazde policko sa priradi inej veci (najvacsie parovanie, aby jedna odpoved nezabrala miesto inej
   a aby sa ta ista vec napisana dvakrat neratala dvakrat) */
function listMatch(vals, items){
  var ok = [], ownerOf = [], res = [], i, j;
  for(i = 0; i < vals.length; i++){
    ok.push([]);
    for(j = 0; j < items.length; j++){ ok[i].push(!!norm(vals[i]) && itemOk(vals[i], items[j])); }
  }
  for(j = 0; j < items.length; j++){ ownerOf.push(-1); }
  function tryAssign(x, seen){
    var y;
    for(y = 0; y < items.length; y++){
      if(!ok[x][y] || seen[y]){ continue; }
      seen[y] = true;
      if(ownerOf[y] < 0 || tryAssign(ownerOf[y], seen)){ ownerOf[y] = x; return true; }
    }
    return false;
  }
  for(i = 0; i < vals.length; i++){ tryAssign(i, {}); }
  for(i = 0; i < vals.length; i++){ res.push(-1); }
  for(j = 0; j < items.length; j++){ if(ownerOf[j] >= 0){ res[ownerOf[j]] = j; } }
  return res;
}
/* datum: mesiac moze byt cislom, slovom (v lubovolnom pade) alebo rimskou cislicou */
var MONTHS = [
  [/\bjanuar\w*/g, 1], [/\bfebruar\w*/g, 2], [/\bmar(ec|ca|ci|cu|com)\b/g, 3], [/\bapril\w*/g, 4],
  [/\bmaj\w*/g, 5], [/\bjun\w*/g, 6], [/\bjul\w*/g, 7], [/\baugust\w*/g, 8],
  [/\bseptemb\w*/g, 9], [/\boktob\w*/g, 10], [/\bnovemb\w*/g, 11], [/\bdecemb\w*/g, 12]
];
/* "v" tu chyba naschval: je to predlozka ("v marci"), nie rimska patka */
var ROMAN = {i:1, ii:2, iii:3, iv:4, vi:6, vii:7, viii:8, ix:9, x:10, xi:11, xii:12};
function dateNums(val){
  var s = norm(val), i, toks, out = [];
  for(i = 0; i < MONTHS.length; i++){ s = s.replace(MONTHS[i][0], " " + MONTHS[i][1] + " "); }
  toks = s.split(" ");
  for(i = 0; i < toks.length; i++){
    if(/^\d+$/.test(toks[i])){ out.push(parseInt(toks[i], 10)); }
    else if(ROMAN.hasOwnProperty(toks[i])){ out.push(ROMAN[toks[i]]); }
  }
  return out;
}
/* staci, ked koniec napisaneho datumu sedi: pri otazke na rok sa uzna aj cely datum */
function dateOk(val, want){
  var got = dateNums(val), i, off;
  if(got.length < want.length){ return false; }
  off = got.length - want.length;
  for(i = 0; i < want.length; i++){
    if(got[off + i] !== want[i]){ return false; }
  }
  return true;
}
function escAttr(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
}
function gradeOf(pct){
  if(pct >= 90){ return 1; }
  if(pct >= 75){ return 2; }
  if(pct >= 50){ return 3; }
  if(pct >= 30){ return 4; }
  return 5;
}
function gradeWord(g){
  return ["", "výborný", "chválitebný", "dobrý", "dostatočný", "nedostatočný"][g];
}
function setAccent(i){
  var p = PAL[i % PAL.length];

}

/* ===== PRIPRAVA OTAZKY NA ZOBRAZENIE =====
   src drzi povodnu otazku, aby sa dala znova zamiesat bez straty spravnej odpovede */
function prepare(src){
  var q = {src:src, t:src.t, q:src.q, e:src.e || "", li:src.li, own:!!src.own, retry:false, req:-1};
  var arr = [], i, sorted, guard;
  if(src.t === "order"){
    for(i = 0; i < src.o.length; i++){ arr.push({x:src.o[i], pos:i}); }
    /* nesmie vyjst uz zoradene, inak by otazka nic nepytala */
    guard = 0;
    do {
      shuffle(arr);
      sorted = true;
      for(i = 0; i < arr.length; i++){ if(arr[i].pos !== i){ sorted = false; } }
      guard++;
    } while(sorted && arr.length > 1 && guard < 20);
    q.items = arr;
  } else if(src.t === "txt"){
    q.acc = src.acc || [];
    q.kw = src.kw || null;
    q.sol = src.sol || q.acc[0];
  } else if(src.t === "date"){
    q.n = src.n;
    q.sol = src.sol;
  } else if(src.t === "list"){
    q.items = src.items;
    q.n = src.n || src.items.length;
  } else if(src.t === "pairs"){
    q.rows = src.rows;
  }
  return q;
}
function multiField(q){ return q.t === "list" || q.t === "pairs"; }
function blankAns(q){
  var out = [], i, k;
  if(q.t === "order"){ return out; }
  if(multiField(q)){
    k = q.t === "list" ? q.n : q.rows.length;
    for(i = 0; i < k; i++){ out.push(""); }
    return out;
  }
  return "";
}
/* pri viacerych polickach: je kazde policko spravne? */
function fieldOk(q, a){
  var out = [], i, res;
  if(q.t === "list"){
    res = listMatch(a, q.items);
    for(i = 0; i < a.length; i++){ out.push(res[i] >= 0); }
  } else if(q.t === "pairs"){
    for(i = 0; i < q.rows.length; i++){ out.push(itemOk(a[i], q.rows[i])); }
  }
  return out;
}
function isOk(q, a){
  var i, f;
  if(q.t === "order"){
    if(a.length !== q.items.length){ return false; }
    for(i = 0; i < a.length; i++){ if(q.items[a[i]].pos !== i){ return false; } }
    return true;
  }
  if(q.t === "txt"){ return accOk(a, q.acc) || kwOk(a, q.kw); }
  if(q.t === "date"){ return dateOk(a, q.n); }
  if(multiField(q)){
    f = fieldOk(q, a);
    for(i = 0; i < f.length; i++){ if(!f[i]){ return false; } }
    return f.length > 0;
  }
  return false;
}
function isEmpty(q, a){
  var i;
  if(q.t === "order"){ return a.length !== q.items.length; }
  if(multiField(q)){
    for(i = 0; i < a.length; i++){ if(String(a[i]).replace(/\s/g, "")){ return false; } }
    return true;
  }
  return !String(a).replace(/\s/g, "");
}
/* text spravnej odpovede a odpovede ziaka do prehladu chyb */
function solText(q){
  var out = [], i, sorted;
  if(q.t === "order"){
    sorted = q.items.slice().sort(function(x, y){ return x.pos - y.pos; });
    for(i = 0; i < sorted.length; i++){ out.push((i + 1) + ". " + sorted[i].x); }
    return out.join("<br>");
  }
  if(q.t === "list"){
    for(i = 0; i < q.items.length; i++){ out.push(q.items[i].s); }
    return (q.n < q.items.length ? "stačí " + q.n + " z týchto: " : "") + out.join(", ");
  }
  if(q.t === "pairs"){
    for(i = 0; i < q.rows.length; i++){ out.push(q.rows[i].l + " – " + q.rows[i].s); }
    return out.join("<br>");
  }
  return q.sol;
}
function yourText(q, a){
  var out = [], i, v;
  if(q.t === "order"){
    for(i = 0; i < a.length; i++){ out.push((i + 1) + ". " + q.items[a[i]].x); }
    return out.join("<br>") || "(nič)";
  }
  if(q.t === "list"){
    for(i = 0; i < a.length; i++){ v = escAttr(String(a[i]).trim()); out.push(v || "–"); }
    return out.join(", ");
  }
  if(q.t === "pairs"){
    for(i = 0; i < q.rows.length; i++){ v = escAttr(String(a[i]).trim()); out.push(q.rows[i].l + ": " + (v || "–")); }
    return out.join("<br>");
  }
  return escAttr(String(a).trim()) || "(nič)";
}
var KIND = {
  txt:"napíš odpoveď", date:"napíš dátum", list:"vymenuj", pairs:"doplň každý riadok", order:"zoraď"
};
function hintOf(q){
  if(q.t === "order"){ return "Ťukaj na udalosti v poradí, v akom išli. Ťuknutím na očíslovanú ju odznačíš."; }
  if(q.t === "list"){ return "Poradie nevadí. Diakritika ani malý preklep nevadia. Enter = ďalšie políčko."; }
  if(q.t === "pairs"){ return "Ku každému riadku napíš odpoveď. Diakritika ani malý preklep nevadia."; }
  if(q.t === "date"){
    if(q.n.length === 3){ return "Napíš deň, mesiac a rok, napríklad 5. 3. 1900."; }
    if(q.n.length === 2){ return "Stačí mesiac a rok, napríklad „jún 1900“ alebo 6. 1900."; }
    return "Napíš rok.";
  }
  if(q.own){ return "Stačí vlastnými slovami, dôležité sú hlavné slová."; }
  return "Na diakritike ani na malom preklepe nezáleží.";
}

    '<div class="lesson">';
  for(i = 0; i < L.blocks.length; i++){ html += blockHtml(L.blocks[i]); }
  html += '</div><div class="card must"><h3>&#127919; Na písomku určite vedieť</h3><ul class="pts">';
  for(i = 0; i < L.must.length; i++){ html += '<li>' + L.must[i] + '</li>'; }
  html += '</ul></div>';
  if(r){
    html += '<div class="small muted" style="padding:0 6px 10px;">Tvoj najlepší výsledok v skúške: ' + r.best + ' z ' + r.total + '.</div>';
  }
  html += '<div class="dock">' +
    (S.li > 0 ? '<button class="btn grey" data-act="lesson" data-val="' + (S.li - 1) + '" aria-label="Predchádzajúca téma">&#8592;</button>' : '') +
    '<button class="btn" data-act="quiz">Vyskúšaj ma (' + L.qs.length + ' otázok) &#8594;</button></div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===== SKUSANIE (spolocne pre skusku z temy, opravu chyb aj velky test) ===== */
function startRun(kind, li, list){
  var qs = [], i;
  shuffle(list);
  for(i = 0; i < list.length; i++){ qs.push(prepare(list[i])); }
  S.run = {kind:kind, li:li, qs:qs, i:0, ans:blankAns(qs[0]), locked:false, log:[], note:""};
  S.screen = "run";
  render();
}
/* velky test berie otazky z tem postupne dokola, aby bola zastupena kazda tema */
function pickFinal(count){
  var pools = [], order = [], out = [], i, any = true;
  for(i = 0; i < LESSONS.length; i++){
    pools.push(shuffle(LESSONS[i].qs.slice()));
    order.push(i);
  }
  if(!count || count > ALLQ.length){ count = ALLQ.length; }
  while(out.length < count && any){
    any = false;
    shuffle(order);
    for(i = 0; i < order.length && out.length < count; i++){
      if(pools[order[i]].length){ out.push(pools[order[i]].pop()); any = true; }
    }
  }
  return out;
}
function viewRun(fresh){
  var R = S.run, q = R.qs[R.i], last = (R.i === R.qs.length - 1);
  setAccent(R.kind === "final" || R.li < 0 ? 3 : R.li);
  var label = (R.kind === "final") ? "Veľký test" : (R.kind === "fix" ? "Oprava chýb" : "Skúška &middot; téma " + (R.li + 1));
  var pct = Math.round(((R.i + (R.locked ? 1 : 0)) / R.qs.length) * 100);
  var html = topbar(label) +
    '<div class="card">' +
      '<div class="kicker">' + label + (q.retry ? ' &middot; ešte raz' : '') + '</div>' +
      '<div class="small muted">Otázka ' + (R.i + 1) + ' z ' + R.qs.length + ' &middot; správne: ' + countOk(R.log) + ' &middot; ' + KIND[q.t] + '</div>' +
      '<div class="bar"><span style="width:' + pct + '%"></span></div>' +
      '<h2>' + q.q + '</h2>' +
      questionHtml(q, R.ans, R.locked);
  if(R.locked){
    html += feedbackHtml(q, R.log[R.log.length - 1]) +
      (R.note ? '<div class="hint">' + R.note + '</div>' : '') +
      '<div class="row" style="margin-top:14px;"><button class="btn wide" data-act="next" id="nextbtn">' +
        (last ? (R.kind === "final" ? "Vyhodnotiť test" : "Ukázať výsledok") : "Ďalej &#8594;") + '</button></div>';
  }
  html += '</div>';
  app.innerHTML = html;
  if(fresh){
    window.scrollTo(0, 0);
    focusInput();
  } else if(R.locked){
    var nb = document.getElementById("nextbtn");
    if(nb && nb.scrollIntoView){ nb.scrollIntoView({block:"nearest", behavior:"smooth"}); }
  }
}
/* precita, co je napisane v polickach */
function grab(){
  var R = S.run, q, ins, i, out;
  if(!R || R.locked){ return; }
  q = R.qs[R.i];
  ins = app.querySelectorAll("input.txtin");
  if(!ins.length){ return; }
  if(multiField(q)){
    out = [];
    for(i = 0; i < ins.length; i++){ out.push(ins[i].value); }
    R.ans = out;
  } else {
    R.ans = ins[0].value;
  }
}
function lockRun(){
  var R = S.run, q = R.qs[R.i], ok = isOk(q, R.ans), again;
  R.locked = true;
  R.note = "";
  R.log.push({q:q, ans:R.ans, ok:ok, retry:q.retry, over:false});
  if(ok){ sGood(); } else { sBad(); }
  /* chyba v skuske sa na konci zopakuje este raz (do vysledku sa ráta len prvy pokus) */
  if(!ok && R.kind !== "final" && !q.retry){
    again = prepare(q.src);
    again.retry = true;
    R.qs.push(again);
    q.req = R.qs.length - 1;
    R.note = "Na konci skúšky sa ťa na to spýtam ešte raz.";
  }
  viewRun(false);
}
/* odpoved bola dobre, len inymi slovami: oprava hodnotenia */
function overrideRun(){
  var R = S.run, q = R.qs[R.i], it = R.log[R.log.length - 1];
  if(!R.locked || !it || it.ok){ return; }
  it.ok = true;
  it.over = true;
  if(q.req >= 0){ R.qs.splice(q.req, 1); q.req = -1; }
  R.note = "";
  sGood();
  viewRun(false);
}
function finishRun(){
  var R = S.run, total = firsts(R.log).length, correct = countOk(R.log), id, prev, pct;
  if(R.kind === "quiz"){
    id = LESSONS[R.li].id;
    prev = P.quiz[id];
    if(!prev || prev.total !== total || correct > prev.best){ P.quiz[id] = {best:correct, total:total}; }
    saveProgress();
    S.screen = "quizres";
  } else if(R.kind === "fix"){
    S.screen = "quizres";
  } else {
    pct = Math.round((correct / total) * 100);
    if(!P.fin || pct > P.fin.pct){ P.fin = {pct:pct, grade:gradeOf(pct)}; }
    saveProgress();
    S.screen = "result";
  }
  sWin();
  render();
}

/* ===== OBRAZOVKA: VYSLEDOK SKUSKY Z TEMY / OPRAVY CHYB ===== */
function viewQuizRes(){
  var R = S.run, total = firsts(R.log).length, correct = countOk(R.log), wrong = total - correct;
  var pct = total ? Math.round((correct / total) * 100) : 0;
  var fromFinal = (R.li < 0);
  var ok = fromFinal ? true : passed(R.li);
  var isLast = (R.li === LESSONS.length - 1);
  var msg, html;
  setAccent(fromFinal ? 3 : R.li);
  if(R.kind === "fix"){
    msg = (wrong === 0) ? "Všetky chyby sú opravené." : "Ešte niečo ostalo. Skús opravu znova.";
  } else if(pct === 100){
    msg = "Bez jedinej chyby. Táto téma ti sedí.";
  } else if(ok && pct >= PASS * 100){
    msg = "Téma je zvládnutá. Chyby si ešte môžeš opraviť.";
  } else {
    msg = "Na zvládnutie témy treba aspoň 80 % na prvý pokus. Prejdi si výklad a skús skúšku ešte raz.";
  }
  html = topbar("Výsledok") +
    '<div class="card center">' +
      '<div class="bigico">' + (wrong === 0 ? "&#127942;" : (pct >= PASS * 100 ? "&#9989;" : "&#128170;")) + '</div>' +
      '<h1>' + (R.kind === "fix" ? "Oprava chýb" : "Skúška z " + (R.li + 1) + ". témy") + '</h1>' +
      (fromFinal ? '' : '<p class="muted">' + LESSONS[R.li].title + '</p>') +
      '<div class="stats">' +
        '<div class="stat"><b>' + correct + ' / ' + total + '</b>správne na prvý pokus</div>' +
        '<div class="stat"><b>' + pct + ' %</b>úspešnosť</div>' +
      '</div>' +
      '<p>' + msg + '</p>' +
      '<div class="col">';
  if(wrong > 0){
    html += '<button class="btn ' + (ok && R.kind !== "fix" ? "ghost" : "") + ' wide" data-act="fix">Opraviť chyby (' + wrong + ')</button>';
  }
  if(fromFinal){
    html += '<button class="btn wide" data-act="final">Nový veľký test</button>';
  } else {
    if(ok){
      html += isLast ?
        '<button class="btn big wide" data-act="final">Ísť na veľký test &#8594;</button>' :
        '<button class="btn big wide" data-act="lesson" data-val="' + (R.li + 1) + '">Ďalšia téma &#8594;</button>';
    }
    html += '<button class="btn ghost wide" data-act="quiz">Celá skúška znova</button>' +
      '<button class="btn grey wide" data-act="lesson" data-val="' + R.li + '">Späť na výklad</button>';
    if(!ok && !isLast){
      html += '<button class="linkbtn" data-act="lesson" data-val="' + (R.li + 1) + '">Ísť na ďalšiu tému aj tak</button>';
    }
  }
  html += '</div></div>';
  if(wrong > 0){
    html += '<div class="card"><h2>Prehľad chýb</h2>' + missHtml(R.log, fromFinal) + '</div>';
  }
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===== OBRAZOVKA: VYSLEDOK VELKEHO TESTU ===== */
function viewResult(){
  var R = S.run, f = firsts(R.log), total = f.length, correct = countOk(R.log), wrong = total - correct;
  var pct = total ? Math.round((correct / total) * 100) : 0;
  var g = gradeOf(pct), i, by = [], it, html;
  setAccent(g <= 2 ? 1 : (g === 3 ? 0 : 2));
  for(i = 0; i < LESSONS.length; i++){ by.push({c:0, t:0}); }
  for(i = 0; i < f.length; i++){
    it = f[i];
    by[it.q.li].t++;
    if(it.ok){ by[it.q.li].c++; }
  }
  html = topbar("Výsledok") +
    '<div class="card"><h1 style="text-align:center;">Tvoja známka</h1>' +
    '<div class="grade">' + g + '</div>' +
    '<p style="text-align:center;font-weight:700;">' + gradeWord(g) + '</p>' +
    '<div class="stats">' +
      '<div class="stat"><b>' + pct + ' %</b>úspešnosť</div>' +
      '<div class="stat"><b>' + correct + '</b>správne</div>' +
      '<div class="stat"><b>' + wrong + '</b>chyby</div>' +
    '</div>' +
    '<div class="col">' +
      (wrong > 0 ? '<button class="btn wide" data-act="fix">Opraviť chyby (' + wrong + ')</button>' : '') +
      '<button class="btn ' + (wrong > 0 ? "ghost" : "") + ' wide" data-act="final">Nový veľký test</button>' +
      '<button class="btn grey wide" data-act="home">Menu</button>' +
    '</div></div>';
  html += '<div class="card"><h2>Ako ti išli témy</h2>';
  for(i = 0; i < LESSONS.length; i++){
    if(!by[i].t){ continue; }
    html += '<div class="trow"><div class="tn">' + (i + 1) + '. ' + LESSONS[i].title + '</div>' +
      '<div class="ts ' + (by[i].c === by[i].t ? "full" : "part") + '">' + by[i].c + ' / ' + by[i].t + '</div>' +
      (by[i].c === by[i].t ? '' : '<button class="btn grey small" data-act="lesson" data-val="' + i + '">Zopakovať</button>') +
      '</div>';
  }
  html += '</div>';
  if(wrong > 0){
    html += '<div class="card"><h2>Prehľad chýb</h2>' + missHtml(R.log, true) + '</div>';
  } else {
    html += '<div class="card center"><h2>Bez chyby! &#127881;</h2><p class="muted">Všetko správne. Na písomku si pripravený.</p></div>';
  }
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===== OBRAZOVKA: TAHAK ===== */
function viewCheat(){
  setAccent(4);
  var html = topbar("Ťahák"), i;
  html += '<div class="card"><h2>&#128197; Dátumy</h2><div class="cheat">';
  for(i = 0; i < TIMELINE.length; i++){
    html += '<div class="k" style="white-space:nowrap;">' + TIMELINE[i][0] + '</div><div>' + TIMELINE[i][1] + '</div>';
  }
  html += '</div></div><div class="card"><h2>&#128100; Osobnosti</h2><div class="cheat">';
  for(i = 0; i < PEOPLE.length; i++){
    html += '<div class="k">' + PEOPLE[i][0] + '</div><div>' + PEOPLE[i][1] + '</div>';
  }
  html += '</div></div><div class="card"><h2>&#128214; Pojmy a zoznamy</h2><div class="cheat">';
  for(i = 0; i < TERMS.length; i++){
    html += '<div class="k">' + TERMS[i][0] + '</div><div>' + TERMS[i][1] + '</div>';
  }
  html += '</div></div>' + mapHtml("csr") +
    '<div class="dock"><button class="btn" data-act="home">Späť do menu</button></div>';
  app.innerHTML = html;
  window.scrollTo(0, 0);
}

/* ===== ROUTER ===== */
function render(){
  if(S.screen === "home"){ viewHome(); }
  else if(S.screen === "lesson"){ viewLesson(); }
  else if(S.screen === "run"){ viewRun(true); }
  else if(S.screen === "quizres"){ viewQuizRes(); }
  else if(S.screen === "result"){ viewResult(); }
  else if(S.screen === "cheat"){ viewCheat(); }
}

/* ===== OVLADANIE (delegovanie udalosti, ziadne inline handlery) ===== */
app.addEventListener("click", function(ev){
  var el = ev.target;
  while(el && el !== app && !(el.getAttribute && el.getAttribute("data-act"))){ el = el.parentNode; }
  if(!el || el === app || el.disabled){ return; }
  handle(el.getAttribute("data-act"), el.getAttribute("data-val"));
});
app.addEventListener("keydown", function(ev){
  if(ev.key !== "Enter" && ev.keyCode !== 13){ return; }
  var t = ev.target, all, k;
  if(!t){ return; }
  /* Enter v policku: dalsie policko, v poslednom = Skontrolovat */
  if(t.classList && t.classList.contains("txtin")){
    ev.preventDefault();
    all = app.querySelectorAll("input.txtin");
    k = Array.prototype.indexOf.call(all, t);
    if(k >= 0 && k < all.length - 1){ all[k + 1].focus(); } else { handle("check"); }
    return;
  }
  if(t.className === "logo"){ handle("home"); }
});

/* rozbehnuty velky test sa neopusta bez opytania */
function leaveOk(){
  var R = S.run;
  if(S.screen === "run" && R && R.kind === "final" && R.log.length > 0){
    return window.confirm("Veľký test ešte nie je dokončený. Naozaj ho chceš ukončiť?");
  }
  return true;
}

function handle(act, val){
  var R = S.run, q, i, list, f, ins;
  if(act === "home"){
    if(!leaveOk()){ return; }
    S.screen = "home"; sClick(); render(); return;
  }
  if(act === "sound"){
    P.sound = !P.sound;
    saveProgress();
    if(P.sound){ ensureAudio(); sClick(); }
    if(S.screen === "run"){ grab(); viewRun(false); } else { render(); }
    return;
  }
  if(act === "lesson"){ S.li = parseInt(val, 10); S.screen = "lesson"; sClick(); render(); return; }
  if(act === "cheat"){ S.screen = "cheat"; sClick(); render(); return; }
  if(act === "cnt"){ S.cnt = parseInt(val, 10); sClick(); render(); return; }
  if(act === "reset"){
    if(window.confirm("Naozaj vymazať celý pokrok?")){
      P.quiz = {}; P.fin = null;
      saveProgress();
      render();
    }
    return;
  }
  if(act === "quiz"){
    /* zo stranky s vysledkom sa opakuje ta ista tema, z vykladu otvorena tema */
    i = (S.screen === "quizres" && R && R.li >= 0) ? R.li : S.li;
    S.li = i;
    sClick();
    startRun("quiz", i, LESSONS[i].qs.slice());
    return;
  }
  if(act === "final"){ sClick(); startRun("final", -1, pickFinal(S.cnt)); return; }
  if(act === "fix"){
    list = [];
    f = firsts(R.log);
    for(i = 0; i < f.length; i++){ if(!f[i].ok){ list.push(f[i].q.src); } }
    if(!list.length){ return; }
    sClick();
    startRun("fix", (R.kind === "final") ? -1 : R.li, list);
    return;
  }
  if(!R || S.screen !== "run"){ return; }
  q = R.qs[R.i];
  if(act === "next"){
    if(!R.locked){ return; }
    if(R.i === R.qs.length - 1){ finishRun(); return; }
    R.i++;
    R.ans = blankAns(R.qs[R.i]);
    R.locked = false;
    R.note = "";
    viewRun(true);
    return;
  }
  if(act === "over"){ overrideRun(); return; }
  if(R.locked){ return; }
  if(act === "ord"){
    i = parseInt(val, 10);
    if(R.ans.indexOf(i) >= 0){ R.ans.splice(R.ans.indexOf(i), 1); } else { R.ans.push(i); }
    viewRun(false);
    return;
  }
  if(act === "dunno"){ grab(); lockRun(); return; }
  if(act === "check"){
    grab();
    if(isEmpty(q, R.ans)){
      ins = app.querySelector("input.txtin");
      if(ins){ ins.focus(); }
      return;
    }
    lockRun();
    return;
  }
}

loadProgress();
render();

/* offline: po prvom otvoreni sa appka ulozi do telefonu (service worker je spolocny pre celu /dejepis/) */
if("serviceWorker" in navigator && (location.protocol === "https:" || location.hostname === "localhost")){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("../sw.js").catch(function(){ /* bez offline rezimu appka funguje dalej */ });
  });
}
</script>
